[project]
name = "fineprint"
version = "0.1.0"
description = "A jury of open-weight models explains your lease before you sign it."
readme = "README.md"
authors = [
    { name = "SAI-RAHUL-M", email = "sairahul2721@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "openai>=3.37.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
fineprint = "fineprint.app:run"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = ["E501"]  # the formatter handles length; long prompt strings are fine

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
